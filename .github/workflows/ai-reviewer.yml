
name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: "latest-known"

      - name: Start backend test services
        run: docker compose up -d --wait db mailpit

      - name: Migrate database
        run: uv run bash scripts/prestart.sh
        working-directory: backend

      - name: Run AI Code Reviewer
        uses: Oussamagrimida/AI-Code-reviewer-Github-Action@main
        with:
          nvidia-api-key: ${{ secrets.NVIDIA_API_KEY }}
          enable-autofix: 'true'
          max-fix-attempts: '2'
          allow-unverified-push: 'false'
          test-command: '["uv", "run", "--directory", "backend", "bash", "scripts/test.sh"]'
